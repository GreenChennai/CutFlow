<!DOCTYPE html>
<!-- CutFlow 花字进阶卡(artboard 模式 S 源卡,ADR-0057) id=huazi.card.section.tab 画布 1080x1920;动画 finite,无 JS -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(160deg,#14151c,#232637);font-family:'Source Han Sans SC','Microsoft YaHei',sans-serif;position:relative}.tab{position:absolute;left:0;top:32%;background:#ffc428;color:#1a1a20;font-size:110px;font-weight:900;padding:26px 90px 26px 70px;clip-path:polygon(0 0,100% 0,calc(100% - 48px) 100%,0 100%);animation:tabin .4s ease-out both;}@keyframes tabin{0%{transform:translateX(-120px);opacity:0}100%{transform:none;opacity:1}}</style>
</head><body><div class='tab'>第二章</div></body></html>
