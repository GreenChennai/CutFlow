<!DOCTYPE html>
<!-- CutFlow 花字进阶卡(artboard 模式 S 源卡,ADR-0057) id=huazi.card.stat.rise 画布 1080x1920;动画 finite,无 JS -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(160deg,#14151c,#232637);font-family:'Source Han Sans SC','Microsoft YaHei',sans-serif;position:relative}.stat{position:absolute;inset:0;display:flex;flex-direction:column;gap:30px;align-items:center;justify-content:center;color:#fff;}.stat em{font-style:normal;font-size:220px;font-weight:900;color:#ffc428;text-shadow:0 10px 0 rgba(0,0,0,.4);animation:countup .6s ease-out both;}.stat i{font-style:normal;font-size:110px}.stat small{font-size:64px;opacity:.85}@keyframes countup{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}</style>
</head><body><div class='stat'><em>98.6<i>%</i></em><small>好评率</small></div></body></html>
