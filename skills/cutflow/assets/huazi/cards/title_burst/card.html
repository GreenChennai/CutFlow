<!DOCTYPE html>
<!-- CutFlow 花字进阶卡(artboard 模式 S 源卡,ADR-0057) id=huazi.card.title.burst 画布 1080x1920;动画 finite,无 JS -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(160deg,#14151c,#232637);font-family:'Source Han Sans SC','Microsoft YaHei',sans-serif;position:relative}.burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:900;color:#fff;text-shadow:0 0 40px #ff445a,0 6px 0 #b91c3a;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;}@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}</style>
</head><body><div class='burst'>标题炸场</div></body></html>
