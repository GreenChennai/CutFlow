<!DOCTYPE html>
<!-- CutFlow 花字进阶卡(artboard 模式 S 源卡,ADR-0057) id=huazi.card.quote.paper 画布 1080x1920;动画 finite,无 JS -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(160deg,#14151c,#232637);font-family:'Source Han Sans SC','Microsoft YaHei',sans-serif;position:relative}.paper{position:absolute;left:80px;right:80px;top:38%;background:#fffdf5;border-radius:18px;padding:70px 60px;font-size:88px;line-height:1.5;color:#3a3630;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:rise .5s ease-out both;}@keyframes rise{0%{transform:translateY(60px);opacity:0}100%{transform:none;opacity:1}}</style>
</head><body><div class='paper'>把每一天,当作作品来打磨</div></body></html>
