# pytest 配置(第五册 T5.3c;补第零册欠账:此前无 marker 注册,perf 一直报
# PytestUnknownMarkWarning)。
#
# marker 纪律:
#   perf —— 性能预算档(test_perf_budget / test_m8_infra 的 @pytest.mark.perf 用例):
#           不进每次提交的常规门禁,CI 用 `pytest -m perf` 单独跑;
#   e2e  —— 端到端档(tests/e2e/ 下,真实或合成素材走全链):默认排除
#           (addopts -m "not e2e"),CI 只跑单元 + 工程层;需要时
#           `pytest -m e2e` 单跑(CLI 的 -m 覆盖 addopts 的 -m)。
[pytest]
testpaths = tests
addopts = -m "not e2e"
markers =
    perf: 性能预算档(不进常规门禁;`pytest -m perf` 单独跑)
    e2e: 端到端档(tests/e2e/;默认排除,`pytest -m e2e` 单跑)
